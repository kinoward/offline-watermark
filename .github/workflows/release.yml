name: Release and Pages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the release
    runs-on: ubuntu-24.04
    container:
      # Official browser and system dependencies, matched to the npm Playwright version.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --user pwuser
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and source
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm ci
      - run: npm test
      - run: npm run build:offline -- dist-offline/Watermark.html
      - run: npm run test:browser
      - name: Prepare the download and Pages artifact
        run: |
          node scripts/pack-imagemagick-source.mjs dist-offline/ImageMagick-WASM-source.tar.gz
          mkdir -p dist-offline/pages
          cp dist-offline/Watermark.html dist-offline/pages/index.html
          cd dist-offline
          sha256sum Watermark.html ImageMagick-WASM-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          compression-level: 0
          if-no-files-found: error
          path: |
            dist-offline/Watermark.html
            dist-offline/ImageMagick-WASM-source.tar.gz
            dist-offline/SHA256SUMS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-offline/pages

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist-offline
      - name: Attach the offline app, checksums and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Watermark $GITHUB_REF_NAME" --latest \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist-offline/Watermark.html dist-offline/SHA256SUMS dist-offline/ImageMagick-WASM-source.tar.gz

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
