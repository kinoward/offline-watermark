name: Update star history

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render daily star history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/stargazers/history" |
            python3 scripts/render-star-history.py > docs/assets/star-history.svg
      - name: Commit the chart if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/assets/star-history.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(readme): refresh star history' -- docs/assets/star-history.svg
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF}"
