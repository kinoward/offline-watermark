<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" data-i18n-content="description" content="在浏览器中为 JPG、JPEG 和 PDF 添加文字水印。" />
    <title>Watermark</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23e9aa4e' width='32' height='32' rx='9'/%3E%3Cpath d='M9 12l14-4M9 18l14-4M9 24l14-4' stroke='%231d1b19' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="ico-mark" viewBox="0 0 24 24"><path d="m5 8 14-4M5 14l14-4M5 20l14-4"/></symbol>
      <symbol id="ico-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></symbol>
      <symbol id="ico-language" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
      <symbol id="ico-expand" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-7 7M10 20H4v-6m0 6 7-7"/></symbol>
      <symbol id="ico-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.3"/></symbol>
      <symbol id="ico-grid" viewBox="0 0 24 24"><path d="M3 5h7v5H3zm11 0h7v5h-7zM8 14h8v5H8zM3 14h1v5H3zm17 0h1v5h-1z"/></symbol>
      <symbol id="ico-sliders" viewBox="0 0 24 24"><path d="M5 4v5m0 4v7m7-16v9m0 4v3m7-16v2m0 4v10"/><circle cx="5" cy="11" r="2"/><circle cx="12" cy="15" r="2"/><circle cx="19" cy="8" r="2"/></symbol>
      <symbol id="ico-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Zm0 0v7h7M8 15h8m-8 3h5"/></symbol>
      <symbol id="ico-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="ico-replace" viewBox="0 0 24 24"><path d="M4 8h14m-4-4 4 4-4 4M20 16H6m4-4-4 4 4 4"/></symbol>
      <symbol id="ico-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
      <symbol id="ico-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
      <symbol id="ico-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="ico-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="ico-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    </svg>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-icon"><svg class="icon"><use href="#ico-mark"/></svg></span>
          <span class="brand-name" lang="en">Watermark</span>
        </div>
        <div class="topbar-actions">
          <span class="privacy" data-i18n-title="localOnly" title="本机处理"><svg class="icon" aria-hidden="true"><use href="#ico-lock"/></svg><span data-i18n="localOnly">本机处理</span></span>
          <div class="language-picker" data-open="false">
            <button id="language-select" type="button" role="combobox" aria-haspopup="listbox" aria-controls="language-list" aria-expanded="false" data-i18n-aria-label="language" aria-label="界面语言">
              <svg class="icon" aria-hidden="true"><use href="#ico-language"/></svg>
              <span id="language-value" lang="zh-CN">简体中文</span>
              <svg class="icon language-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
            </button>
            <div id="language-list" role="listbox" data-i18n-aria-label="language" aria-label="界面语言" aria-hidden="true" inert>
              <div role="option" id="language-zh-CN" data-value="zh-CN" lang="zh-CN" aria-selected="true"><span>简体中文</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-zh-TW" data-value="zh-TW" lang="zh-TW" aria-selected="false"><span>繁體中文</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-en" data-value="en" lang="en" aria-selected="false"><span>English</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-ja" data-value="ja" lang="ja" aria-selected="false"><span>日本語</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-ko" data-value="ko" lang="ko" aria-selected="false"><span>한국어</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-es" data-value="es" lang="es" aria-selected="false"><span>Español</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-fr" data-value="fr" lang="fr" aria-selected="false"><span>Français</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
              <div role="option" id="language-ru" data-value="ru" lang="ru" aria-selected="false"><span>Русский</span><svg class="icon language-check" aria-hidden="true"><use href="#ico-check"/></svg></div>
            </div>
          </div>
          <div id="desktop-toggle-slot" class="desktop-only"></div>
        </div>
      </div>
    </header>
    <input id="file-input" type="file" accept=".jpg,.jpeg,.pdf" hidden />

    <main class="page">
      <div id="workbench" class="workspace" data-has-file="false" data-import-view="start">
        <div class="editor-panes">
          <section class="preview-card" aria-labelledby="preview-title">
            <div class="card-head preview-head">
              <div class="section-title"><span class="preview-signal" aria-hidden="true"></span><h1 id="preview-title" data-i18n="preview">水印预览</h1></div>
              <div class="preview-tools">
                <span class="style-label"><svg class="icon"><use href="#ico-grid"/></svg><span data-i18n="brick">砖形平铺</span></span>
                <span id="preview-filename" class="preview-filename" hidden></span>
                <span id="desktop-file-size" class="desktop-only file-size"></span>
                <span class="compact-sample-name" data-i18n="artworkTitle">山脊习作</span>
              </div>
              <div id="desktop-import-slot" class="desktop-only"></div>
            </div>
            <dialog id="preview-surface" open role="region" aria-labelledby="preview-title">
              <div class="preview-board">
                <div class="board-corner board-tl"></div><div class="board-corner board-tr"></div>
                <div class="board-corner board-bl"></div><div class="board-corner board-br"></div>
                <div id="preview-paper" class="paper" data-i18n-aria-label="sampleArtwork" aria-label="山脊插画样张及实时水印">
                  <div class="proof-print" aria-hidden="true">
                    <div class="proof-photo"><canvas id="photo-sample" width="840" height="440"></canvas></div>
                    <div class="proof-cutline"><strong data-i18n="artworkTitle">山脊习作</strong><span class="step-wedge"></span></div>
                  </div>
                  <canvas id="preview-canvas" width="720" height="466" aria-hidden="true"></canvas>
                </div>
                <canvas id="image-preview" class="image-preview" role="img" data-i18n-aria-label="imagePreviewLabel" aria-label="图片水印预览" hidden></canvas>
                <div id="preview-placeholder" class="preview-placeholder" hidden>
                  <svg class="icon"><use href="#ico-file"/></svg>
                  <p id="preview-message" role="status"></p>
                </div>
                <canvas id="pdf-page-canvas" class="image-preview" role="img" data-i18n-aria-label="pdfPagePreview" aria-label="PDF 页面预览" hidden></canvas>
                <div id="pdf-viewport" class="pdf-viewport" hidden>
                  <iframe id="pdf-preview" class="pdf-preview" data-i18n-title="pdfEffect" title="PDF 水印效果"></iframe>
                </div>
                <span id="pdf-preview-status" class="pdf-preview-status" role="status" hidden></span>
                <div id="start-import-slot" class="start-import-slot">
                  <div id="import-entry" class="import-entry">
                    <button id="add-files" class="button import-button" type="button"><svg class="icon" aria-hidden="true"><use class="add-glyph" href="#ico-plus"/><use class="replace-glyph" href="#ico-replace"/></svg><span id="add-label">添加文件</span></button>
                    <span class="import-hint" data-i18n="formats">支持 JPG、JPEG、PDF</span>
                    <span class="desktop-only drop-hint" data-i18n="dropFile">拖入 JPG、JPEG 或 PDF</span>
                  </div>
                </div>
                <button id="expand-preview" type="button" aria-haspopup="dialog" data-i18n-aria-label="expandPreview" aria-label="放大水印预览">
                  <span class="expand-hint"><svg class="icon" aria-hidden="true"><use href="#ico-expand"/></svg><span data-i18n="expandPreview">放大预览</span></span>
                </button>
                <div class="desktop-only drop-overlay" aria-hidden="true"><span><svg class="icon"><use href="#ico-file"/></svg><span data-i18n="dropFile">拖入 JPG、JPEG 或 PDF</span></span></div>
              </div>
              <div id="pdf-page-tools" class="pdf-pager" hidden>
                <button id="pdf-page-prev" class="button" data-i18n="prevPage" type="button">上一页</button>
                <span id="pdf-page-count" aria-live="polite"></span>
                <button id="pdf-page-next" class="button" data-i18n="nextPage" type="button">下一页</button>
              </div>
              <div class="viewer-bar">
                <h2 id="viewer-title">水印预览</h2>
                <a id="viewer-open-pdf" data-i18n="openPreview" href="#" target="_blank" rel="noopener noreferrer" hidden>打开预览文件</a>
                <button id="close-preview" class="button ghost" type="button"><svg class="icon" aria-hidden="true"><use href="#ico-arrow"/></svg><span data-i18n="back">返回编辑</span></button>
              </div>
            </dialog>
            <div class="preview-meta">
              <div class="preview-info">
                <span id="preview-caption">排版示意</span><span class="meta-dot"></span><span id="preview-opacity">透明度 20%</span>
              </div>
              <div id="compact-import-slot"></div>
              <span class="compact-formats" data-i18n="formats">支持 JPG、JPEG、PDF</span>
              <a id="open-pdf-preview" class="preview-link" target="_blank" rel="noopener noreferrer" hidden>在新标签页打开 PDF</a>
              <div id="desktop-pattern-slot" class="desktop-only"></div>
              <div id="desktop-focus-actions" class="desktop-only"></div>
            </div>
          </section>

          <aside id="tool-rail" class="tool-rail" data-i18n-aria-label="settingsExport" aria-label="水印设置和导出">
            <section id="settings-panel" class="settings" aria-labelledby="settings-title">
              <div class="card-head">
                <div class="section-title"><svg class="icon"><use href="#ico-sliders"/></svg><h2 id="settings-title" data-i18n="settings" tabindex="-1">水印设置</h2></div><button id="close-inspector" class="button ghost" type="button" data-i18n-title="collapse" data-i18n-aria-label="collapse" title="收起设置" aria-label="收起设置"><svg class="icon"><use href="#ico-close"/></svg></button>
              </div>
              <div class="settings-body">
                <div class="text-field">
                  <label class="field-label" for="watermark-text"><span data-i18n="text">水印文字</span><span class="field-detail" data-i18n="multiline">可换行</span></label>
                  <textarea id="watermark-text" maxlength="300" rows="3" spellcheck="false" autocomplete="off" data-i18n-placeholder="textPlaceholder" placeholder="例如：仅限内部使用">仅限内部使用
请勿外传</textarea>
                </div>
                <div class="layout-fields">
                  <div class="range-field">
                    <div class="field-label">
                      <label for="watermark-size" data-i18n="size">水印大小</label>
                      <div class="field-actions">
                        <span class="value-field"><input id="size-value" type="number" data-i18n-aria-label="sizeInput" inputmode="numeric" autocomplete="off" aria-label="输入水印大小百分比" /><span aria-hidden="true">%</span></span>
                        <button id="size-reset" class="button reset-button" type="button" aria-label="重置水印大小"><span aria-hidden="true">↺</span></button>
                      </div>
                    </div>
                    <input id="watermark-size" type="range" min="25" max="200" value="100" autocomplete="off" />
                    <div class="range-guide" aria-hidden="true"><span data-i18n="small">小</span><span data-i18n="large">大</span></div>
                  </div>
                  <div class="range-field">
                    <div class="field-label">
                      <label for="watermark-density" data-i18n="density">水印密度</label>
                      <div class="field-actions">
                        <span class="value-field"><input id="density-value" type="number" data-i18n-aria-label="densityInput" inputmode="numeric" autocomplete="off" aria-label="输入水印密度百分比" /><span aria-hidden="true">%</span></span>
                        <button id="density-reset" class="button reset-button" type="button" aria-label="重置水印密度"><span aria-hidden="true">↺</span></button>
                      </div>
                    </div>
                    <input id="watermark-density" type="range" min="50" max="300" value="100" autocomplete="off" />
                    <div class="range-guide" aria-hidden="true"><span data-i18n="sparse">稀疏</span><span data-i18n="dense">紧密</span></div>
                  </div>
                  <div class="range-field">
                    <div class="field-label">
                      <label for="opacity" data-i18n="opacity">水印透明度</label>
                      <div class="field-actions">
                        <span class="value-field"><input id="opacity-value" type="number" data-i18n-aria-label="opacityInput" inputmode="numeric" autocomplete="off" aria-label="输入水印透明度百分比" /><span aria-hidden="true">%</span></span>
                        <button id="opacity-reset" class="button reset-button" type="button" aria-label="重置水印透明度"><span aria-hidden="true">↺</span></button>
                      </div>
                    </div>
                    <input id="opacity" type="range" min="1" max="100" value="20" autocomplete="off" />
                    <div class="range-guide" aria-hidden="true"><span data-i18n="faint">浅</span><span data-i18n="strong">深</span></div>
                  </div>
                </div>
                <details id="compact-export-options">
                  <summary>
                    <svg class="icon" aria-hidden="true"><use href="#ico-download"/></svg>
                    <span data-i18n="exportSettings">导出设置</span>
                    <svg class="icon disclosure-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
                  </summary>
                  <div id="compact-export-slot"></div>
                </details>
                <section id="desktop-export-panel" class="desktop-only" aria-labelledby="desktop-export-title">
                  <div class="desktop-export-head">
                    <h3 id="desktop-export-title"><svg class="icon" aria-hidden="true"><use href="#ico-download"/></svg><span data-i18n="exportSettings">导出设置</span></h3>
                    <span id="desktop-result-size" class="file-size"></span>
                  </div>
                  <div id="desktop-name-slot"></div>
                  <details id="desktop-codec">
                    <summary><span><span data-i18n="quality">JPEG 导出质量</span> · <span lang="en">EXIF</span></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></summary>
                    <div id="desktop-codec-slot">
                      <div id="jpeg-settings" hidden>
                        <div id="quality-field" class="range-field quality-field">
                          <div class="field-label">
                            <label for="quality" data-i18n="quality">JPEG 导出质量</label>
                            <div class="field-actions">
                              <span class="value-field"><input id="quality-value" type="number" data-i18n-aria-label="qualityInput" inputmode="numeric" autocomplete="off" aria-label="输入 JPEG 导出质量" /></span>
                              <button id="quality-reset" class="button reset-button" type="button" aria-label="重置 JPEG 导出质量"><span aria-hidden="true">↺</span></button>
                            </div>
                          </div>
                          <input id="quality" type="range" min="1" max="100" value="100" autocomplete="off" aria-describedby="quality-help" />
                          <div class="range-guide" id="quality-help"><span data-i18n="smallerFile">体积更小</span><span data-i18n="higherQuality">质量更高</span></div>
                        </div>
                        <label class="exif-setting" for="clear-exif">
                          <span class="field-label" id="exif-label" data-i18n="clearExif">清除 EXIF 信息</span>
                          <input id="clear-exif" type="checkbox" autocomplete="off" aria-labelledby="exif-label" aria-describedby="exif-help" />
                          <span class="field-detail" id="exif-help" data-i18n="exifHelp">移除 EXIF 中的拍摄时间、设备和定位等信息</span>
                        </label>
                      </div>
                    </div>
                  </details>
                </section>
              </div>
            </section>
          </aside>
        </div>
          <div id="settings-action" class="settings-action">
            <div class="dock-info" id="dock-info">
              <span class="dock-private"><svg class="icon" aria-hidden="true"><use href="#ico-lock"/></svg><span data-i18n="refreshClears">刷新后清空本次任务</span></span>
            <div id="export-name-field" hidden>
              <label class="field-label" for="export-name" data-i18n="exportName">导出文件名</label>
              <div class="file-field">
                <input id="export-name" type="text" autocomplete="off" spellcheck="false" />
                <span id="export-extension" class="file-extension" aria-hidden="true"></span>
              </div>
            </div>
            <div id="file-notice" class="notice" role="status" hidden>
              <svg class="notice-check icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" pathLength="1"/></svg>
              <span id="notice-text"></span>
            </div>
            </div>
            <div class="export-actions">
              <button id="quick-preview" class="button secondary" type="button" aria-haspopup="dialog" data-i18n-aria-label="expandPreview" data-i18n-title="expandPreview" aria-label="放大预览" title="放大预览"><svg class="icon" aria-hidden="true"><use href="#ico-eye"/></svg></button>
              <div id="compact-start-slot"></div>
              <button id="mobile-settings" class="button panel-toggle" type="button" aria-expanded="true" aria-controls="settings-panel"><svg class="icon"><use class="standard-toggle-icon" href="#ico-sliders"/><use class="desktop-only" href="#ico-panel"/></svg><span id="toggle-label">收起设置</span></button>
              <button id="generate" class="button primary" type="button" disabled><span id="generate-label">生成水印</span><svg class="icon"><use href="#ico-arrow"/></svg></button>
              <button id="save-file" class="button secondary" type="button" hidden>保存到文件夹</button>
              <button id="download" class="button primary" type="button" hidden><span data-i18n="download">下载文件</span><svg class="icon"><use href="#ico-download"/></svg></button>
            </div>
          </div>
      </div>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
